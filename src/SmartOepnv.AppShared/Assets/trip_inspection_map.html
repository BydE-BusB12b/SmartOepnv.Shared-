<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body, #map { height: 100%; margin: 0; background: #0a1628; }
    .leaflet-container { background: #0a1628; font: 13px/1.35 Segoe UI, sans-serif; }
    .trace-time-tooltip {
      background: #0d2137;
      color: #fff59d;
      border: 1px solid #ffeb3b;
      border-radius: 6px;
      padding: 4px 8px;
      font-weight: 700;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(0,0,0,.45);
    }
    .trace-time-tooltip::before { border-top-color: #ffeb3b; }
    .trace-neighbor-tooltip {
      background: #132a45;
      color: #e3f2fd;
      border: 1px solid #64b5f6;
      border-radius: 5px;
      padding: 2px 6px;
      font-size: 11px;
      font-weight: 600;
    }
    .trace-hint {
      position: absolute;
      z-index: 1000;
      left: 52px;
      top: 10px;
      background: rgba(13, 33, 55, 0.92);
      color: #cfd8dc;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      pointer-events: none;
      border: 1px solid rgba(255,235,59,.35);
      max-width: 280px;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="trace-hint" id="hint">Klick auf Spur oder Punkt → Uhrzeit · ±3 Nachbarpunkte</div>
  <script>
    const map = L.map('map', { zoomControl: true }).setView([51.45, 7.01], 11);
    L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    let layer = L.layerGroup().addTo(map);
    let selectionLayer = L.layerGroup().addTo(map);
    /** @type {{lat:number, lon:number, t:string, label:string, speed:number, ts:number, bt:boolean|null, pi:boolean|null}[]} */
    let tracePoints = [];
    /** @type {L.Polyline[]} */
    let polylines = [];

    const TRACE_YELLOW = '#FFEB3B';
    const TRACE_BLUE_BT_OFF = '#42A5F5';
    const TRACE_RED_NO_PAS = '#E53935';

    function clearTrace() {
      layer.clearLayers();
      selectionLayer.clearLayers();
      tracePoints = [];
      polylines = [];
    }

    function parseOptionalBool(v) {
      if (typeof v === 'boolean') return v;
      if (v === 0 || v === '0') return false;
      if (v === 1 || v === '1') return true;
      return null;
    }

    function normalizePoints(raw) {
      const out = [];
      for (const p of (raw || [])) {
        if (p && typeof p === 'object' && !Array.isArray(p)) {
          const lat = Number(p.lat);
          const lon = Number(p.lon);
          if (!isFinite(lat) || !isFinite(lon)) continue;
          out.push({
            lat, lon,
            t: String(p.t || ''),
            label: String(p.label || p.t || ''),
            speed: Number(p.speed) || 0,
            ts: Number(p.ts) || 0,
            bt: parseOptionalBool(p.bt),
            pi: parseOptionalBool(p.pi)
          });
          continue;
        }
        // Legacy: [lat, lon]
        if (Array.isArray(p) && p.length >= 2) {
          const lat = Number(p[0]);
          const lon = Number(p[1]);
          if (!isFinite(lat) || !isFinite(lon)) continue;
          out.push({ lat, lon, t: '', label: '', speed: 0, ts: 0, bt: null, pi: null });
        }
      }
      return out;
    }

    /** Bluetooth aus → blau; an oder unbekannt (Altdaten) → gelb. */
    function isBtOff(p) {
      return p && p.bt === false;
    }

    /** Pas.Info aus → rote Streifen; an oder unbekannt (Altdaten) → keine. */
    function isPasInfoOff(p) {
      return p && p.pi === false;
    }

    function styleKey(p) {
      return (isBtOff(p) ? '1' : '0') + (isPasInfoOff(p) ? '1' : '0');
    }

    function haversineM(aLat, aLon, bLat, bLon) {
      const R = 6371000;
      const toRad = Math.PI / 180;
      const dLat = (bLat - aLat) * toRad;
      const dLon = (bLon - aLon) * toRad;
      const la1 = aLat * toRad;
      const la2 = bLat * toRad;
      const h = Math.sin(dLat / 2) ** 2 +
        Math.cos(la1) * Math.cos(la2) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
    }

    function nearestIndex(lat, lon) {
      let best = -1;
      let bestD = Infinity;
      for (let i = 0; i < tracePoints.length; i++) {
        const p = tracePoints[i];
        const d = haversineM(lat, lon, p.lat, p.lon);
        if (d < bestD) {
          bestD = d;
          best = i;
        }
      }
      return best;
    }

    function clearSelection() {
      selectionLayer.clearLayers();
    }

    function showPointSelection(index) {
      clearSelection();
      if (index < 0 || index >= tracePoints.length) return;

      const center = tracePoints[index];
      const from = Math.max(0, index - 3);
      const to = Math.min(tracePoints.length - 1, index + 3);

      for (let i = from; i <= to; i++) {
        if (i === index) continue;
        const p = tracePoints[i];
        const dir = i < index ? '←' : '→';
        const offset = Math.abs(i - index);
        L.circleMarker([p.lat, p.lon], {
          radius: 6,
          color: '#42a5f5',
          fillColor: '#90caf9',
          fillOpacity: 0.95,
          weight: 2
        })
          .bindTooltip(`${dir}${offset}  ${p.t || p.label || ''}`, {
            permanent: true,
            direction: 'top',
            offset: [0, -6],
            className: 'trace-neighbor-tooltip'
          })
          .addTo(selectionLayer)
          .on('click', function (e) {
            L.DomEvent.stopPropagation(e);
            showPointSelection(i);
          });
      }

      const speedPart = center.speed > 0 ? ` · ${center.speed} km/h` : '';
      const btPart = isBtOff(center) ? ' · BT aus' : '';
      const pasPart = isPasInfoOff(center) ? ' · Pas.Info aus' : '';
      L.circleMarker([center.lat, center.lon], {
        radius: 10,
        color: isBtOff(center) ? TRACE_BLUE_BT_OFF : '#ffeb3b',
        fillColor: isBtOff(center) ? '#90caf9' : '#fff59d',
        fillOpacity: 1,
        weight: 3
      })
        .bindTooltip(`${center.label || center.t || '–'}${speedPart}${btPart}${pasPart}`, {
          permanent: true,
          direction: 'top',
          offset: [0, -10],
          className: 'trace-time-tooltip'
        })
        .addTo(selectionLayer)
        .openTooltip();
    }

    function onTraceLineClick(e) {
      L.DomEvent.stopPropagation(e);
      const idx = nearestIndex(e.latlng.lat, e.latlng.lng);
      showPointSelection(idx);
    }

    /**
     * Basis: gelb (BT an/unbekannt) bzw. blau (BT aus).
     * Pas.Info aus: zusätzlich rote Strichelung darüber.
     */
    function addColoredPolylines(points) {
      if (points.length < 2) return;
      let runStart = 0;
      let runKey = styleKey(points[0]);

      function flush(endIdx) {
        if (endIdx <= runStart) return;
        const latlngs = [];
        for (let i = runStart; i <= endIdx; i++) {
          latlngs.push([points[i].lat, points[i].lon]);
        }
        const btOff = runKey.charAt(0) === '1';
        const pasOff = runKey.charAt(1) === '1';
        const base = L.polyline(latlngs, {
          color: btOff ? TRACE_BLUE_BT_OFF : TRACE_YELLOW,
          weight: 6,
          opacity: 0.92,
          interactive: true
        }).addTo(layer);
        base.on('click', onTraceLineClick);
        polylines.push(base);
        if (pasOff) {
          const stripes = L.polyline(latlngs, {
            color: TRACE_RED_NO_PAS,
            weight: 5,
            opacity: 0.95,
            dashArray: '14, 12',
            lineCap: 'butt',
            interactive: true
          }).addTo(layer);
          stripes.on('click', onTraceLineClick);
          polylines.push(stripes);
        }
      }

      for (let i = 1; i < points.length; i++) {
        const key = styleKey(points[i]);
        if (key !== runKey) {
          flush(i);
          runStart = i;
          runKey = key;
        }
      }
      flush(points.length - 1);
    }

    function loadTrace(payload) {
      clearTrace();
      tracePoints = normalizePoints(payload && payload.points);
      if (tracePoints.length === 0) {
        return;
      }

      addColoredPolylines(tracePoints);

      // Alle Punkte klickbar (klein, unauffällig) – Zeit erst nach Auswahl.
      for (let i = 0; i < tracePoints.length; i++) {
        const p = tracePoints[i];
        const isEnd = i === 0 || i === tracePoints.length - 1;
        const midBtOff = !isEnd && isBtOff(p);
        const midPasOff = !isEnd && isPasInfoOff(p);
        const stroke = i === 0 ? '#43a047'
          : (i === tracePoints.length - 1 ? '#e53935'
            : (midPasOff ? TRACE_RED_NO_PAS : (midBtOff ? '#1e88e5' : '#fbc02d')));
        const fill = i === 0 ? '#66bb6a'
          : (i === tracePoints.length - 1 ? '#ef5350'
            : (midPasOff ? '#ef9a9a' : (midBtOff ? '#64b5f6' : '#ffee58')));
        const midHint = [
          midBtOff ? 'BT aus' : '',
          midPasOff ? 'Pas.Info aus' : ''
        ].filter(Boolean).join(' · ');
        L.circleMarker([p.lat, p.lon], {
          radius: isEnd ? 7 : 4,
          color: stroke,
          fillColor: fill,
          fillOpacity: isEnd ? 1 : 0.55,
          weight: isEnd ? 2 : 1,
          opacity: isEnd ? 1 : 0.7
        })
          .bindTooltip(
            i === 0 ? 'Start'
              : (i === tracePoints.length - 1 ? 'Ende'
                : ((p.t || '') + (midHint ? ' · ' + midHint : ''))),
            { permanent: false }
          )
          .addTo(layer)
          .on('click', function (e) {
            L.DomEvent.stopPropagation(e);
            showPointSelection(i);
          });
      }

      const bounds = L.latLngBounds(tracePoints.map(p => [p.lat, p.lon]));
      if (bounds.isValid()) {
        map.fitBounds(bounds.pad(0.12));
      }
      setTimeout(function () { map.invalidateSize(); }, 50);
    }

    function applyTracePayload(payload) {
      loadTrace(payload || {});
    }

    function invalidateMapSize() {
      setTimeout(function () { map.invalidateSize(); }, 50);
    }

    map.on('click', function () {
      // Klick neben die Spur: Auswahl entfernen
      clearSelection();
    });

    window.applyTracePayload = applyTracePayload;
    window.invalidateMapSize = invalidateMapSize;
    window.loadTrace = loadTrace;

    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.addEventListener('message', function (event) {
        const msg = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
        if (!msg) return;
        if (msg.type === 'loadTrace') loadTrace(msg.payload || msg || {});
        if (msg.type === 'invalidateSize') invalidateMapSize();
      });
    }
  </script>
</body>
</html>
