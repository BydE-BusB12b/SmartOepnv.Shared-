<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body { height: 100%; margin: 0; background: #0a1628; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
    body { position: relative; overflow: hidden; }
    #map { position: absolute; inset: 0; }
    .leaflet-container { background: #0a1628; font: 13px/1.4 "Segoe UI", system-ui, sans-serif; }
    .node-marker-wrap { background: transparent !important; border: none !important; pointer-events: none !important; }
    .leaflet-marker-icon.node-marker-wrap { background: transparent !important; border: none !important; pointer-events: none !important; }
    .node-dot {
      border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.45);
      pointer-events: auto !important; cursor: grab;
    }
    .leaflet-marker-icon.node-marker-wrap.leaflet-dragging .node-dot { cursor: grabbing; }
    .node-label { pointer-events: none; }
    .node-dot.node-selected {
      border-color: #ffeb3b;
      box-shadow: 0 0 0 3px rgba(255,235,59,0.9), 0 1px 4px rgba(0,0,0,.45);
    }
    .node-label {
      font: 11px/1.2 Segoe UI, sans-serif; color: #fff; background: rgba(0,0,0,0.72);
      padding: 2px 6px; border-radius: 6px; margin-top: 2px; max-width: 120px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .nav-symbol-icon {
      width: 36px; height: 36px; border-radius: 6px;
      background: rgba(255,255,255,0.95); border: 2px solid #1b5e20;
      box-shadow: 0 2px 8px rgba(0,0,0,.45); object-fit: contain; padding: 2px;
      cursor: pointer; pointer-events: none;
    }
    .nav-symbol-icon.nav-selected {
      border-color: #ffeb3b;
      box-shadow: 0 0 0 3px rgba(255,235,59,0.9), 0 2px 8px rgba(0,0,0,.45);
    }
    .nav-symbol-wrap {
      position: relative; width: 40px; height: 40px;
      pointer-events: auto; cursor: grab; touch-action: none;
    }
    .nav-symbol-wrap.nav-dragging { cursor: grabbing; }
    .nav-symbol-badge {
      position: absolute; top: -7px; left: -7px; min-width: 16px; height: 16px;
      padding: 0 3px; border-radius: 9px; background: #111827; color: #fff;
      font: bold 10px/16px Segoe UI, sans-serif; text-align: center;
      pointer-events: none;
    }
    .nav-symbol-fallback {
      width: 36px; height: 36px; border-radius: 50%;
      background: #1b5e20; border: 2px solid #fff; color: #fff;
      font: bold 11px/32px Segoe UI, sans-serif; text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.45); cursor: pointer;
    }
    .nav-symbol-fallback.nav-selected {
      border-color: #ffeb3b;
      box-shadow: 0 0 0 3px rgba(255,235,59,0.9), 0 2px 8px rgba(0,0,0,.45);
    }
    .nav-marker-draggable { cursor: grab; }
    .nav-marker-draggable.leaflet-dragging { cursor: grabbing; }
    /* Über Haltestellen/Ansage-Markern (markerPane 600) und deren Tooltips (650) */
    .leaflet-nav-maneuver-pane { z-index: 680 !important; }
    .leaflet-marker-icon.nav-marker-leaflet { pointer-events: auto !important; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    let map, draft = null, markers = {}, lines = {}, navMarkers = {}, selectedFrom = null;
    let draggingNodeId = null;
    let selectedNavMarkerKey = null;
    let autoFitRouteView = true;
    let userAdjustedMapView = false;
    let programmaticMapMove = false;
    let mapViewPersistTimer = null;
    let lastLineTapKey = null;
    let lastLineTapAtMs = 0;
    const EDGE = '\u0001';
    const NAV_HIDDEN = '__nav_hidden__';
    const SEGMENT_LINE_DOUBLE_TAP_MS = 450;

    function post(msg) {
      if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage(msg);
    }

    function nodeColor(type) {
      if (type === 'STOP') return '#42a5f5';
      if (type === 'ANNOUNCEMENT') return '#66bb6a';
      return '#ffb74d';
    }

    function edgeKey(from, to) { return from + EDGE + to; }

    function edgeTouchesNode(key, nodeId) {
      if (!key || !nodeId) return false;
      const parts = key.split(EDGE);
      return parts.length === 2 && (parts[0] === nodeId || parts[1] === nodeId);
    }

    function interpolateStraightBusPoints(from, to) {
      const distM = Math.max(1, haversineMeters(from, to));
      let steps = Math.round(distM / 25);
      steps = Math.max(8, Math.min(80, steps));
      const pts = [];
      const denom = Math.max(1, steps - 1);
      for (let i = 0; i < steps; i++) {
        const t = i / denom;
        pts.push({
          lat: from.lat + (to.lat - from.lat) * t,
          lon: from.lon + (to.lon - from.lon) * t
        });
      }
      return pts;
    }

    function syncBusStraightSegmentGeometry() {
      if (!draft) return;
      const busKeys = draft.roadBusStraightEdgeKeys || [];
      if (!busKeys.length) return;
      draft.segmentSnaps = draft.segmentSnaps || [];
      (draft.segments || []).forEach(seg => {
        const key = edgeKey(seg.fromNodeId, seg.toNodeId);
        if (!busKeys.includes(key)) return;
        const a = nodeCoord(draft.nodes.find(x => x.id === seg.fromNodeId));
        const b = nodeCoord(draft.nodes.find(x => x.id === seg.toNodeId));
        if (!a || !b) return;
        const straight = interpolateStraightBusPoints(a, b);
        let snap = segmentSnap(seg);
        if (!snap) {
          snap = {
            fromNodeId: seg.fromNodeId,
            toNodeId: seg.toNodeId,
            points: straight,
            maneuvers: [{ distanceM: 0, instruction: 'Geradeaus (Busspur / direkt)', navSymbolType: 'straight' }]
          };
          draft.segmentSnaps.push(snap);
        } else {
          // Bereits echte Straßen-Geometrie und keine Busspur-Anweisung:
          // Key war vermutlich fälschlich gesetzt (Multi-Manuell) – Gerade nicht erzwingen.
          const hasBusInstr = (snap.maneuvers || []).some(m =>
            String(m.instruction || '').toLowerCase().includes('busspur'));
          const pts = (snap.points || []).map(normalizePoint).filter(Boolean);
          if (!hasBusInstr && pts.length >= 4) {
            const mid = pts[Math.floor(pts.length / 2)];
            const direct = haversineMeters(a, b);
            const viaMid = haversineMeters(a, mid) + haversineMeters(mid, b);
            if (direct > 1 && viaMid > direct * 1.08) {
              draft.roadBusStraightEdgeKeys = busKeys.filter(k => k !== key);
              return;
            }
          }
          snap.points = straight;
          if (!snap.maneuvers || !snap.maneuvers.length) {
            snap.maneuvers = [{ distanceM: 0, instruction: 'Geradeaus (Busspur / direkt)', navSymbolType: 'straight' }];
          }
        }
      });
    }

    function routeLineColor() {
      const c = (draft && draft.routeLineColor) ? String(draft.routeLineColor).trim() : '';
      return /^#[0-9a-fA-F]{6}$/.test(c) ? c : '#2196f3';
    }

    function renumberSegments() {
      (draft.segments || []).sort((a, b) => (a.order || 0) - (b.order || 0))
        .forEach((s, i) => { s.order = i + 1; });
    }

    function closestLatLngOnPolyline(latlngs, click) {
      if (!latlngs || latlngs.length < 2) return click;
      let best = latlngs[0];
      let bestDist = Infinity;
      for (let i = 1; i < latlngs.length; i++) {
        const a = latlngs[i - 1], b = latlngs[i];
        const ax = a[0], ay = a[1], bx = b[0], by = b[1];
        const px = click.lat, py = click.lng;
        const dx = bx - ax, dy = by - ay;
        const denom = dx * dx + dy * dy;
        const t = denom <= 0 ? 0 : Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / denom));
        const lat = ax + dx * t, lon = ay + dy * t;
        const dLat = lat - click.lat, dLon = lon - click.lng;
        const dist = dLat * dLat + dLon * dLon;
        if (dist < bestDist) { bestDist = dist; best = L.latLng(lat, lon); }
      }
      return best;
    }

    function invalidateSnapsForSegment(fromId, toId) {
      if (!draft) return;
      const key = edgeKey(fromId, toId);
      draft.roadSnappedEdgeKeys = (draft.roadSnappedEdgeKeys || []).filter(k => k !== key);
      draft.roadBusStraightEdgeKeys = (draft.roadBusStraightEdgeKeys || []).filter(k => k !== key);
      draft.segmentSnaps = (draft.segmentSnaps || []).filter(s =>
        !(s.fromNodeId === fromId && s.toNodeId === toId));
    }

    function splitPolylineAtDistance(shape, splitMeters) {
      if (!shape || shape.length < 2) {
        return { before: shape ? shape.slice() : [], after: shape ? shape.slice() : [], splitPoint: null };
      }
      let remaining = Math.max(0, splitMeters || 0);
      const before = [shape[0]];
      for (let i = 1; i < shape.length; i++) {
        const a = shape[i - 1], b = shape[i];
        const len = haversineMeters(a, b);
        if (remaining <= len || i === shape.length - 1) {
          const t = len <= 0 ? 0 : Math.min(1, remaining / len);
          const splitPoint = {
            lat: a.lat + (b.lat - a.lat) * t,
            lon: a.lon + (b.lon - a.lon) * t
          };
          before.push(splitPoint);
          const after = [splitPoint];
          if (t < 1 - 1e-9) after.push(b);
          for (let j = i + 1; j < shape.length; j++) after.push(shape[j]);
          return { before, after, splitPoint };
        }
        before.push(b);
        remaining -= len;
      }
      const last = shape[shape.length - 1];
      return { before: shape.slice(), after: [last, last], splitPoint: last };
    }

    function insertWaypointOnSegment(seg, clickLatLng, latlngs) {
      const shape = latlngs.map(p => ({ lat: Number(p[0] ?? p.lat), lon: Number(p[1] ?? p.lon) }));
      const along = Math.max(0, distanceAlongPolylineMeters(latlngs, clickLatLng));
      const split = splitPolylineAtDistance(shape, along);
      const snapPt = split.splitPoint || closestLatLngOnPolyline(latlngs, clickLatLng);
      const id = 'manual_' + Date.now();
      draft.nodes.push({
        id, type: 'MANUAL_WAYPOINT', title: 'Zwischenpunkt ' + id.slice(-4),
        lat: snapPt.lat, lon: snapPt.lon || snapPt.lng, sourceStopName: null
      });
      const idx = (draft.segments || []).findIndex(s =>
        s.fromNodeId === seg.fromNodeId && s.toNodeId === seg.toNodeId);
      if (idx < 0) return;
      const order = draft.segments[idx].order || (idx + 1);

      const oldSnap = segmentSnap(seg);
      const oldMans = (oldSnap && oldSnap.maneuvers) ? oldSnap.maneuvers.slice() : [];
      const wasSnapped = segmentEdgeSnapped(seg);
      const wasBus = (draft.roadBusStraightEdgeKeys || []).includes(edgeKey(seg.fromNodeId, seg.toNodeId));
      invalidateSnapsForSegment(seg.fromNodeId, seg.toNodeId);

      draft.segments.splice(idx, 1,
        { order: order, fromNodeId: seg.fromNodeId, toNodeId: id },
        { order: order + 1, fromNodeId: id, toNodeId: seg.toNodeId }
      );
      renumberSegments();

      const mans1 = oldMans
        .filter(m => (m.distanceM || 0) <= along + 0.5)
        .map(m => Object.assign({}, m));
      const mans2 = oldMans
        .filter(m => (m.distanceM || 0) > along + 0.5)
        .map(m => Object.assign({}, m, { distanceM: Math.max(0, (m.distanceM || 0) - along) }));

      draft.segmentSnaps = draft.segmentSnaps || [];
      const snap1 = {
        fromNodeId: seg.fromNodeId,
        toNodeId: id,
        points: split.before,
        maneuvers: mans1
      };
      const snap2 = {
        fromNodeId: id,
        toNodeId: seg.toNodeId,
        points: split.after,
        maneuvers: mans2
      };
      draft.segmentSnaps.push(snap1, snap2);
      if (wasSnapped || (split.before && split.before.length >= 3)) {
        markSegmentRoadSnapped({ fromNodeId: seg.fromNodeId, toNodeId: id });
      }
      if (wasSnapped || (split.after && split.after.length >= 3)) {
        markSegmentRoadSnapped({ fromNodeId: id, toNodeId: seg.toNodeId });
      }
      if (wasBus) {
        ensureBusStraightEdgeKey({ fromNodeId: seg.fromNodeId, toNodeId: id });
        ensureBusStraightEdgeKey({ fromNodeId: id, toNodeId: seg.toNodeId });
      }

      selectedFrom = null;
      render();
      notifyDraftChanged(true);
      post({ type: 'segmentSelected', from: seg.fromNodeId, to: id });
      post({ type: 'segmentAdded', from: seg.fromNodeId, to: id });
      post({ type: 'segmentAdded', from: id, to: seg.toNodeId });
    }

    function segmentSnap(seg) {
      const snaps = draft.segmentSnaps || [];
      return snaps.find(s => s.fromNodeId === seg.fromNodeId && s.toNodeId === seg.toNodeId) || null;
    }

    function normalizePoint(p) {
      if (!p) return null;
      const lat = Number(p.lat ?? p.latitude);
      const lon = Number(p.lon ?? p.lng ?? p.longitude);
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;
      return { lat, lon };
    }

    function segmentEdgeKey(seg) {
      return edgeKey(seg.fromNodeId, seg.toNodeId);
    }

    function segmentEdgeSnapped(seg) {
      const key = segmentEdgeKey(seg);
      const busKeys = draft.roadBusStraightEdgeKeys || [];
      if (busKeys.includes(key)) return true;
      if (isRoadGeometrySnap(seg)) return true;
      const snapKeys = draft.roadSnappedEdgeKeys || [];
      if (!snapKeys.includes(key)) return false;
      const hit = segmentSnap(seg);
      return !!(hit && hit.points && hit.points.length >= 3);
    }

    function isRoadGeometrySnap(seg) {
      const hit = segmentSnap(seg);
      if (!hit || !hit.points || hit.points.length < 2) return false;
      const pts = hit.points.map(normalizePoint).filter(Boolean);
      if (pts.length >= 3) return true;
      const a = draft.nodes.find(x => x.id === seg.fromNodeId);
      const b = draft.nodes.find(x => x.id === seg.toNodeId);
      const ca = nodeCoord(a), cb = nodeCoord(b);
      if (!ca || !cb) return false;
      const air = haversineMeters(ca, cb);
      const path = polylineLengthMeters(pts);
      return path > air * 1.15 + 8;
    }

    function syncSnapKeysFromGeometry() {
      if (!draft) return;
      draft.roadSnappedEdgeKeys = draft.roadSnappedEdgeKeys || [];
      (draft.segments || []).forEach(seg => {
        const key = segmentEdgeKey(seg);
        if (isRoadGeometrySnap(seg) && !draft.roadSnappedEdgeKeys.includes(key)) {
          draft.roadSnappedEdgeKeys.push(key);
        }
      });
    }

    function ensureBusStraightEdgeKey(seg) {
      if (!draft || !seg) return;
      const key = edgeKey(seg.fromNodeId, seg.toNodeId);
      draft.roadBusStraightEdgeKeys = draft.roadBusStraightEdgeKeys || [];
      if (!draft.roadBusStraightEdgeKeys.includes(key)) {
        draft.roadBusStraightEdgeKeys.push(key);
      }
    }

    function syncKeysFromSegmentSnaps() {
      if (!draft) return;
      draft.roadSnappedEdgeKeys = draft.roadSnappedEdgeKeys || [];
      draft.roadBusStraightEdgeKeys = draft.roadBusStraightEdgeKeys || [];
      (draft.segmentSnaps || []).forEach(s => {
        if (!s || !s.fromNodeId || !s.toNodeId) return;
        const key = edgeKey(s.fromNodeId, s.toNodeId);
        // Nur explizite Busspur-Anweisung – mehrere „Manuell“-Symbole auf
        // Straßensnap dürfen die Kante NICHT zur Busspur machen (sonst wird
        // die OSRM-Geometrie bei jedem Render wieder zur Gerade überschrieben).
        const hasBus = (s.maneuvers || []).some(m =>
          String(m.instruction || '').toLowerCase().includes('busspur'));
        if (hasBus && !draft.roadBusStraightEdgeKeys.includes(key)) {
          draft.roadBusStraightEdgeKeys.push(key);
        }
      });
    }

    function pruneOrphanSegmentGeometry() {
      if (!draft) return;
      const validKeys = new Set((draft.segments || []).map(s => edgeKey(s.fromNodeId, s.toNodeId)));
      draft.segmentSnaps = (draft.segmentSnaps || []).filter(s =>
        validKeys.has(edgeKey(s.fromNodeId, s.toNodeId)));
      draft.roadSnappedEdgeKeys = (draft.roadSnappedEdgeKeys || []).filter(k => validKeys.has(k));
      draft.roadBusStraightEdgeKeys = (draft.roadBusStraightEdgeKeys || []).filter(k => validKeys.has(k));
      syncSnapKeysFromGeometry();
      syncKeysFromSegmentSnaps();
    }

    function dedupeSegmentsForDraw() {
      const list = (draft.segments || []).slice();
      const byEdge = new Map();
      list.forEach(seg => {
        const key = segmentEdgeKey(seg);
        const prev = byEdge.get(key);
        if (!prev) {
          byEdge.set(key, seg);
          return;
        }
        if (segmentMapDisplayRank(seg) > segmentMapDisplayRank(prev)) {
          byEdge.set(key, seg);
        }
      });
      return Array.from(byEdge.values()).sort((a, b) => (a.order || 0) - (b.order || 0));
    }

    function segmentMapDisplayRank(seg) {
      const key = segmentEdgeKey(seg);
      let rank = 0;
      const snapKeys = draft.roadSnappedEdgeKeys || [];
      const busKeys = draft.roadBusStraightEdgeKeys || [];
      if (snapKeys.includes(key)) rank += 4;
      if (busKeys.includes(key)) rank += 4;
      const hit = segmentSnap(seg);
      const pts = hit && hit.points ? hit.points : [];
      if (pts.length >= 3) rank += 2;
      return rank * 1000 + (seg.order || 0);
    }

    function removeLineLayersForKey(key) {
      if (lines[key]) {
        map.removeLayer(lines[key]);
        delete lines[key];
      }
      if (lines[key + '_hit']) {
        map.removeLayer(lines[key + '_hit']);
        delete lines[key + '_hit'];
      }
      if (lines[key + '_sel']) {
        map.removeLayer(lines[key + '_sel']);
        delete lines[key + '_sel'];
      }
    }

    function segmentPoints(seg) {
      const hit = segmentSnap(seg);
      if (!hit || !hit.points || hit.points.length < 2) return null;
      const pts = hit.points.map(normalizePoint).filter(Boolean);
      if (pts.length < 2) return null;
      const key = segmentEdgeKey(seg);
      const busKeys = draft.roadBusStraightEdgeKeys || [];
      if (busKeys.includes(key)) return pts;
      if (segmentEdgeSnapped(seg)) return pts;
      // Geometrie in segmentSnaps (z. B. nach Waypoint auf gesnapptem Teilstück)
      if (pts.length >= 3) return pts;
      return null;
    }

    function markSegmentRoadSnapped(seg) {
      if (!draft || !seg) return;
      draft.roadSnappedEdgeKeys = draft.roadSnappedEdgeKeys || [];
      const key = segmentEdgeKey(seg);
      if (!draft.roadSnappedEdgeKeys.includes(key)) {
        draft.roadSnappedEdgeKeys.push(key);
      }
    }

    function segmentManeuvers(seg) {
      const hit = segmentSnap(seg);
      return hit && hit.maneuvers ? hit.maneuvers : [];
    }

    function isNavHidden(symbolType) {
      return (symbolType || '').trim() === NAV_HIDDEN;
    }

    function symbolFileForType(symbolType) {
      const s = (symbolType || '').toLowerCase();
      const map = {
        roundabout_1_4: 'Navi Kreisverkehr 1.Ausfahrt.png', roundabout_1_5: 'Navi Kreisverkehr 1.Ausfahrt bei 5.png',
        roundabout_2_4: 'Navi Kreisverkehr gerade aus.png', roundabout_2_5: 'Navi Kreisverkehr gerade aus.png',
        roundabout_3_4: 'Navi Kreisverkehr 3.Ausfahrt.png', roundabout_3_5: 'Navi Kreisverkehr 3.Ausfahrt.png',
        roundabout_4_4: 'Navi Kreisverkehr 4.Ausfahrt bei 4.png',
        roundabout_4_5: 'Navi Kreisverkehr 4.Ausfahrt bei 5.png',
        roundabout_5_5: 'Navi Kreisverkehr 5.Ausfahrt bei 5.png',
        t_left: 'Navi T-Kreuzung links.png', t_right: 'Navi T-Kreuzung rechts.png',
        cross_4_left: 'Navi Kreuzung links.png', left: 'Navi Kreuzung links.png',
        cross_4_right: 'Navi Kreuzung rechts.png', right: 'Navi Kreuzung rechts.png',
        cross_4_straight: 'Navi Kreuzung gerade aus.png',
        cross_5: 'Navi 5 armige Kreuzung halb rechts.png',
        cross_5_left: 'Navi Y-Kreuzung 5 Richtungen halb links.png',
        cross_5_right: 'Navi 5 armige Kreuzung halb rechts.png',
        kink_t_right: 'Navi links gekippte T-Kreuzung rechts.png',
        kink_t_left: 'Navi rechts gekippte T-Kreuzung links.png',
        kink_t_left_straight: 'Navi links gekippte T-Kreuzung gerade aus.png',
        kink_t_right_straight: 'Navi rechts gekippte T-Kreuzung gerade aus.png',
        priority_follow_left: 'Navi Vorfahrtsstrasse nach links folgen.png',
        priority_follow_right: 'Navi Vorfahrtsstrasse nach rechts folgen.png',
        priority_leave_left_straight: 'Navi Vorfahrtsstrasse nach links geradeaus verlassen.png',
        priority_leave_right_straight: 'Navi Vorfahrtsstrasse nach rechts geradeaus verlassen.png',
        double_t_right_left: 'Navi Doppel-T Kreuzung rechts-links.png',
        double_t_left_right: 'Navi Doppel-T Kreuzung links-rechts.png',
        shifted_double_t_left_right: 'Navi Verschobene Doppel-T-Kreuzung links+rechts.png',
        shifted_double_t_right_left: 'Navi Verschobene Doppel-T-Kreuzung rechts+links.png',
        shifted_t_to_cross_left_right: 'Navi Verschobene T-Kreuzung zur 4 armige Kreuzung links+rechts.png',
        special_cross_left: 'Navi Sonderform Kreuzung links abbiegen.png',
        special_cross_right: 'Navi Sonderform Kreuzung rechts abbiegen.png',
        special_cross_left_plain: 'Navi Sonderform Kreuzung links.png',
        special_cross_right_plain: 'Navi Sonderform Kreuzung rechts.png',
        u_turn_custom: 'Navi U-Turn Zusatz.png',
        u_turn: 'Navi U-Turn.png',
        fork_left: 'Navi Y-Kreuzung links.png', fork_right: 'Navi Y-Kreuzung rechts.png',
        off_route: 'Navi Route verlassen.png',
        straight: 'Navi gerade aus.png', straight_stop: 'Navi gerade aus.png',
        haltestelle: 'Navi Haltesstelle.png',
        goal: 'Navi Ziel.png',
        keep_left: 'Navi Linke Spur - Links abfahren.png', slight_left: 'Navi Linke Spur - Links abfahren.png',
        left_lane_exit: 'Navi Linke Spur - Links abfahren.png',
        keep_right: 'Navi rechts Spur - rechts abfahren.png', slight_right: 'Navi rechts Spur - rechts abfahren.png',
        right_lane_exit: 'Navi rechts Spur - rechts abfahren.png', motorway_exit: 'Navi rechts Spur - rechts abfahren.png'
      };
      return map[s] || null;
    }

    function mapInstructionToSymbol(text) {
      const t = (text || '').toLowerCase();
      if (t.includes('linienweg verlassen') || t.includes('route verlassen')) return 'off_route';
      if (t.includes('u-turn') || t.includes('uturn') || t.includes('wenden')) return 'u_turn_custom';
      if (t.includes('kreisverkehr') || t.includes('ausfahrt')) {
        const isFiveArm = t.includes('5') || t.includes('fünf');
        const suffix = isFiveArm ? '_5' : '_4';
        if (t.includes('4')) return 'roundabout_4' + suffix;
        if (t.includes('3')) return 'roundabout_3' + suffix;
        if (t.includes('2')) return 'roundabout_2' + suffix;
        return 'roundabout_1' + suffix;
      }
      const hasLeft = t.includes('links');
      const hasRight = t.includes('rechts');
      const hasHalfLeft = t.includes('halb links') || t.includes('leicht links');
      const hasHalfRight = t.includes('halb rechts') || t.includes('leicht rechts');
      if (hasHalfLeft) return 'slight_left';
      if (hasHalfRight) return 'slight_right';
      if (t.includes('t-kreuz') || t.includes('t kreuz')) return hasLeft ? 't_left' : 't_right';
      if (t.includes('kreuzung') && (t.includes('gerade aus') || t.includes('geradeaus')) && !hasLeft && !hasRight) {
        return 'cross_4_straight';
      }
      if (hasLeft && !hasRight) return 'left';
      if (hasRight) return 'right';
      if (t.includes('gerade')) return 'straight';
      return 'straight';
    }

    function effectiveSymbolType(m) {
      const explicit = (m.navSymbolType || '').trim();
      if (isNavHidden(explicit)) return NAV_HIDDEN;
      if (explicit) return explicit;
      return mapInstructionToSymbol(m.instruction);
    }

    function isManualManeuver(m) {
      return (m.instruction || '').toLowerCase().includes('manuell');
    }

    function navSymbolLabel(symbolType) {
      const id = (symbolType || 'straight').trim();
      const labels = draft && draft.navSymbolLabels;
      if (labels && labels[id]) return labels[id];
      return id;
    }

    function maneuverDisplayLabel(maneuver, symbolType) {
      if (isManualManeuver(maneuver)) return navSymbolLabel(symbolType);
      const ins = (maneuver.instruction || '').trim();
      return ins || navSymbolLabel(symbolType);
    }

    function isRedundantSegmentStartStraight(m, symbolType, segmentLengthMeters) {
      const sym = (symbolType || '').toLowerCase();
      if (sym !== 'straight' && sym !== 'straight_stop') return false;
      const instruction = (m.instruction || '').trim().toLowerCase();
      const genericStraight = !instruction ||
        instruction === 'geradeaus' || instruction === 'gerade aus' ||
        instruction === 'start' || instruction.includes('busspur / direkt');
      if (!genericStraight) return false;
      const dist = Number(m.distanceM) || 0;
      const limit = segmentLengthMeters > 0 ? Math.min(35, segmentLengthMeters * 0.35) : 35;
      return dist <= limit;
    }

    function shouldDisplayManeuverOnMap(m, symbolType, segmentLengthMeters) {
      if (isNavHidden(symbolType) || isNavHidden((m.navSymbolType || '').trim())) return false;
      const instruction = (m.instruction || '').trim().toLowerCase();
      if (instruction === 'start' || instruction === 'ziel') return false;
      if (isManualManeuver(m)) return true;
      if (isRedundantSegmentStartStraight(m, symbolType, segmentLengthMeters)) return false;
      return true;
    }

    function navIconUrl(fileName) {
      return 'navi_grafiken/' + encodeURIComponent(fileName);
    }

    function createNavSymbolIcon(symbolType, isSelected, badgeText) {
      const file = symbolFileForType(symbolType);
      const label = (symbolType || '?').slice(0, 2).toUpperCase();
      const sel = isSelected ? ' nav-selected' : '';
      const badge = badgeText ? '<span class="nav-symbol-badge">' + badgeText + '</span>' : '';
      const inner = file
        ? '<img class="nav-symbol-icon' + sel + '" src="' + navIconUrl(file) + '" alt="' + symbolType + '" />'
        : '<div class="nav-symbol-fallback' + sel + '">' + label + '</div>';
      const html = '<div class="nav-symbol-wrap">' + badge + inner + '</div>';
      return L.divIcon({ className: 'nav-marker-draggable', html, iconSize: [44, 44], iconAnchor: [22, 22] });
    }

    function haversineMeters(a, b) {
      const R = 6371000;
      const toRad = x => x * Math.PI / 180;
      const dLat = toRad(b.lat - a.lat);
      const dLon = toRad(b.lon - a.lon);
      const lat1 = toRad(a.lat), lat2 = toRad(b.lat);
      const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
      return 2 * R * Math.asin(Math.sqrt(h));
    }

    function samplePointAtDistance(shape, targetMeters) {
      if (!shape || shape.length === 0) return null;
      if (shape.length === 1) return shape[0];
      let remaining = Math.max(0, targetMeters || 0);
      for (let i = 1; i < shape.length; i++) {
        const a = shape[i - 1], b = shape[i];
        const len = haversineMeters(a, b);
        if (remaining <= len || i === shape.length - 1) {
          const t = len <= 0 ? 0 : Math.min(1, remaining / len);
          return { lat: a.lat + (b.lat - a.lat) * t, lon: a.lon + (b.lon - a.lon) * t };
        }
        remaining -= len;
      }
      return shape[shape.length - 1];
    }

    function polylineLengthMeters(shape) {
      if (!shape || shape.length < 2) return 0;
      let sum = 0;
      for (let i = 1; i < shape.length; i++) {
        sum += haversineMeters(shape[i - 1], shape[i]);
      }
      return sum;
    }

    function distanceAlongPolylineMeters(latlngs, click) {
      if (!latlngs || latlngs.length < 2) return 0;
      let bestDist = Infinity;
      let bestAlong = 0;
      let cumulative = 0;
      for (let i = 1; i < latlngs.length; i++) {
        const a = latlngs[i - 1], b = latlngs[i];
        const ax = a[0], ay = a[1], bx = b[0], by = b[1];
        const px = click.lat, py = click.lng;
        const dx = bx - ax, dy = by - ay;
        const denom = dx * dx + dy * dy;
        const t = denom <= 0 ? 0 : Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / denom));
        const lat = ax + dx * t, lon = ay + dy * t;
        const dLat = lat - click.lat, dLon = lon - click.lng;
        const dist = dLat * dLat + dLon * dLon;
        const segLen = haversineMeters({ lat: ax, lon: ay }, { lat: bx, lon: by });
        if (dist < bestDist) {
          bestDist = dist;
          bestAlong = cumulative + segLen * t;
        }
        cumulative += segLen;
      }
      return bestAlong;
    }

    function segmentPolylinePoints(seg) {
      const pts = segmentPoints(seg);
      if (pts && pts.length >= 2) return pts;
      const a = draft.nodes.find(x => x.id === seg.fromNodeId);
      const b = draft.nodes.find(x => x.id === seg.toNodeId);
      const ca = nodeCoord(a), cb = nodeCoord(b);
      if (!ca || !cb) return null;
      return [{ lat: ca.lat, lon: ca.lon }, { lat: cb.lat, lon: cb.lon }];
    }

    function ensureSegmentSnap(seg, latlngs) {
      draft.segmentSnaps = draft.segmentSnaps || [];
      let snap = segmentSnap(seg);
      if (!snap) {
        snap = {
          fromNodeId: seg.fromNodeId,
          toNodeId: seg.toNodeId,
          points: latlngs.map(p => ({ lat: Number(p[0] ?? p.lat), lon: Number(p[1] ?? p.lon) })),
          maneuvers: []
        };
        draft.segmentSnaps.push(snap);
      } else if (!snap.maneuvers) {
        snap.maneuvers = [];
      }
      if (!snap.points || snap.points.length < 2) {
        snap.points = latlngs.map(p => ({ lat: Number(p[0] ?? p.lat), lon: Number(p[1] ?? p.lon) }));
      }
      if (snap.points.length >= 3) {
        markSegmentRoadSnapped(seg);
      }
      return snap;
    }

    function emitNavSymbolSelected(seg, idx, symbolType, instruction, options) {
      options = options || {};
      post({
        type: 'navSymbolSelected',
        draftJson: window.getDraftJson ? window.getDraftJson() : null,
        recordUndo: !!options.recordUndo,
        from: seg.fromNodeId,
        to: seg.toNodeId,
        maneuverIndex: idx,
        symbolType: symbolType,
        instruction: instruction || symbolType
      });
    }

    function insertManeuverOnSegment(seg, clickLatLng, latlngs) {
      const shape = latlngs.map(p => ({ lat: Number(p[0]), lon: Number(p[1]) }));
      const segLen = polylineLengthMeters(shape);
      if (segLen <= 0) return;
      const key = edgeKey(seg.fromNodeId, seg.toNodeId);
      const isBus = (draft.roadBusStraightEdgeKeys || []).includes(key);
      const along = Math.max(0, Math.min(segLen, distanceAlongPolylineMeters(latlngs, clickLatLng)));
      const snap = ensureSegmentSnap(seg, latlngs);
      const maneuver = {
        distanceM: along,
        instruction: 'Manuell',
        navSymbolType: 'straight'
      };
      snap.maneuvers.push(maneuver);
      snap.maneuvers.sort((a, b) => (a.distanceM || 0) - (b.distanceM || 0));
      const idx = snap.maneuvers.indexOf(maneuver);
      markSegmentRoadSnapped(seg);
      if (isBus) ensureBusStraightEdgeKey(seg);
      selectedNavMarkerKey = edgeKey(seg.fromNodeId, seg.toNodeId) + '_m' + idx;
      draft.selectedNavMarkerKey = selectedNavMarkerKey;
      rebuildSnappedShapeFromSegments();
      delete draft.navDisplayNumbers;
      render();
      notifyDraftChanged(true);
      emitNavSymbolSelected(seg, idx, 'straight', 'Manuell', { recordUndo: true });
      post({ type: 'segmentSelected', from: seg.fromNodeId, to: seg.toNodeId, maneuverIndex: idx });
    }

    function nodeCoord(n) {
      if (!n) return null;
      let lat = Number(n.lat);
      let lon = Number(n.lon);
      if ((!Number.isFinite(lat) || !Number.isFinite(lon)) && n.position) {
        const p = n.position;
        lat = Number(p.lat ?? p.latitude);
        lon = Number(p.lon ?? p.lng ?? p.longitude);
      }
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;
      return { lat, lon };
    }

    function normalizeDraftNodes(d) {
      if (!d || !Array.isArray(d.nodes)) return;
      d.nodes.forEach(n => {
        const c = nodeCoord(n);
        if (!c) return;
        n.lat = c.lat;
        n.lon = c.lon;
      });
    }

    function collectRouteBounds() {
      const pts = [];
      if (!draft) return pts;
      (draft.nodes || []).forEach(n => {
        const c = nodeCoord(n);
        if (c) pts.push([c.lat, c.lon]);
      });
      (draft.snappedShape || []).forEach(p => {
        const lat = Number(p.lat), lon = Number(p.lon);
        if (Number.isFinite(lat) && Number.isFinite(lon)) pts.push([lat, lon]);
      });
      (draft.segmentSnaps || []).forEach(s => {
        (s.points || []).forEach(p => {
          const lat = Number(p.lat), lon = Number(p.lon);
          if (Number.isFinite(lat) && Number.isFinite(lon)) pts.push([lat, lon]);
        });
      });
      return pts;
    }

    window.fitMapToRoute = function() {
      if (!map || !draft || userAdjustedMapView || !autoFitRouteView) return false;
      const pts = collectRouteBounds();
      if (!pts.length) return false;
      programmaticMapMove = true;
      if (pts.length === 1) {
        map.setView(pts[0], 15, { animate: false });
      } else {
        map.fitBounds(pts, { padding: [48, 48], maxZoom: 16, animate: false });
      }
      setTimeout(function() { programmaticMapMove = false; }, 50);
      return true;
    };

    function tryRestoreMapView(d) {
      if (!map || !d) return false;
      var lat = Number(d.mapViewLat);
      var lon = Number(d.mapViewLon);
      var zoom = Number(d.mapViewZoom);
      if (!Number.isFinite(lat) || !Number.isFinite(lon) || !Number.isFinite(zoom) || zoom <= 0) {
        return false;
      }
      programmaticMapMove = true;
      userAdjustedMapView = true;
      autoFitRouteView = false;
      map.setView([lat, lon], zoom, { animate: false });
      setTimeout(function() { programmaticMapMove = false; }, 50);
      return true;
    }

    function persistMapViewToDraft() {
      if (!draft || !map) return;
      var c = map.getCenter();
      var z = map.getZoom();
      draft.mapViewLat = c.lat;
      draft.mapViewLon = c.lng;
      draft.mapViewZoom = z;
      post({ type: 'mapViewChanged', lat: c.lat, lon: c.lng, zoom: z });
    }

    function schedulePersistMapView() {
      if (!draft || !map) return;
      if (mapViewPersistTimer) clearTimeout(mapViewPersistTimer);
      mapViewPersistTimer = setTimeout(function() {
        mapViewPersistTimer = null;
        persistMapViewToDraft();
      }, 350);
    }

    window.fitBoundsPoints = function(pts) {
      if (!map || !pts || !pts.length) return false;
      if (userAdjustedMapView || !autoFitRouteView) return false;
      programmaticMapMove = true;
      if (pts.length === 1) {
        map.setView(pts[0], 15, { animate: false });
      } else {
        map.fitBounds(pts, { padding: [48, 48], maxZoom: 16, animate: false });
      }
      setTimeout(function() { programmaticMapMove = false; }, 50);
      return true;
    };

    function ensureNavManeuverPane() {
      if (!map || map.getPane('navManeuverPane')) return;
      map.createPane('navManeuverPane');
      const pane = map.getPane('navManeuverPane');
      pane.classList.add('leaflet-nav-maneuver-pane');
      pane.style.pointerEvents = 'none';
    }

    function initMap() {
      map = L.map('map', { zoomControl: true, doubleClickZoom: false }).setView([51.16, 10.45], 6);
      ensureNavManeuverPane();
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '&copy; OpenStreetMap'
      }).addTo(map);
      map.on('zoomend dragend', function() {
        if (programmaticMapMove) return;
        userAdjustedMapView = true;
        autoFitRouteView = false;
        schedulePersistMapView();
      });
      map.on('contextmenu', e => {
        if (!draft) return;
        const id = 'manual_' + Date.now();
        draft.nodes.push({
          id, type: 'MANUAL_WAYPOINT', title: 'Manuell ' + id.slice(-4),
          lat: e.latlng.lat, lon: e.latlng.lng, sourceStopName: null
        });
        render(); notifyDraftChanged(true);
      });
    }

    function resolvePayload(raw) {
      if (!raw) return null;
      if (typeof raw === 'string') {
        try { return JSON.parse(raw); } catch (e) { return null; }
      }
      return raw;
    }

    function applyDraft(payload, options) {
      options = options || {};
      var pendingConnect = selectedFrom;
      draft = resolvePayload(payload);
      if (!draft) {
        post({ type: 'draftLoaded', message: 'Karten-Daten leer oder ungültig.' });
        return;
      }
      if (draft.draftGeneration == null && payload && payload.draftGeneration != null) {
        draft.draftGeneration = payload.draftGeneration;
      }
      if (options.resetView) {
        userAdjustedMapView = false;
        autoFitRouteView = true;
        pendingConnect = null;
        selectedNavMarkerKey = null;
        if (draft) {
          delete draft.mapViewLat;
          delete draft.mapViewLon;
          delete draft.mapViewZoom;
        }
      } else if (!options.restoreMapView) {
        userAdjustedMapView = true;
        autoFitRouteView = false;
      }
      normalizeDraftNodes(draft);
      draft.mapEditGeneration = 0;
      rebuildSegmentSnapsArray();
      if (pendingConnect && (draft.nodes || []).some(n => n.id === pendingConnect)) {
        selectedFrom = pendingConnect;
      } else if (options.resetView) {
        selectedFrom = null;
      }
      if (options.resetView) {
        selectedNavMarkerKey = null;
      } else if (typeof draft.selectedNavMarkerKey === 'string' && draft.selectedNavMarkerKey) {
        selectedNavMarkerKey = draft.selectedNavMarkerKey;
      }
      render();
      var stopCount = (draft.nodes || []).filter(n => n.type === 'STOP').length;
      var annCount = (draft.nodes || []).filter(n => n.type === 'ANNOUNCEMENT').length;
      var segCount = (draft.segments || []).length;
      var onMap = (draft.nodes || []).filter(n => nodeCoord(n)).length;
      post({
        type: 'draftLoaded',
        message: onMap > 0
          ? ('Karte: ' + stopCount + ' Haltestellen, ' + annCount + ' Ansagepunkte, ' +
             onMap + ' Marker sichtbar, ' + segCount + ' Verbindungen.')
          : (stopCount + annCount > 0
            ? 'Knoten vorhanden, aber keine gültigen GPS-Koordinaten für die Karte.'
            : 'Keine Haltestellen – bitte „Haltestellen laden“.')
      });
      if (options.resetView) {
        invalidateMapSize(true);
      } else if (options.restoreMapView && tryRestoreMapView(draft)) {
        invalidateMapSize(false);
      } else {
        schedulePersistMapView();
        invalidateMapSize(false);
      }
    }

    window.loadDraft = function(jsonText, options) {
      try {
        // ExecuteScript übergibt ein JS-Objekt, PostMessage/JSON-Datei einen String.
        var payload = (typeof jsonText === 'string') ? JSON.parse(jsonText) : jsonText;
        applyDraft(payload, options);
      } catch (e) {
        draft = null;
        post({ type: 'draftLoaded', message: 'Karten-Daten konnten nicht gelesen werden: ' + e.message });
      }
    };

    window.invalidateMapSize = function(fitRoute) {
      if (!map) return;
      function tick() {
        map.invalidateSize();
        if (fitRoute && !userAdjustedMapView && autoFitRouteView && window.fitMapToRoute) fitMapToRoute();
      }
      setTimeout(tick, 80);
      setTimeout(tick, 320);
      setTimeout(tick, 640);
    };

    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.addEventListener('message', function(ev) {
        try {
          var msg = typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data;
          if (msg && msg.type === 'loadDraft' && msg.payload) {
            applyDraft(resolvePayload(msg.payload), msg.options || {});
          }
        } catch (e) {
          post({ type: 'draftLoaded', message: 'Karten-Nachricht fehlgeschlagen: ' + e.message });
        }
      });
    }

    function dedupeSegmentSnaps() {
      if (!draft || !Array.isArray(draft.segmentSnaps)) return;
      const byEdge = new Map();
      (draft.segmentSnaps || []).forEach(s => {
        if (!s || !s.fromNodeId || !s.toNodeId) return;
        const key = edgeKey(s.fromNodeId, s.toNodeId);
        const prev = byEdge.get(key);
        if (!prev) {
          byEdge.set(key, s);
          return;
        }
        const prevPts = prev.points || [];
        const curPts = s.points || [];
        if (curPts.length > prevPts.length) prev.points = curPts;
        const prevM = prev.maneuvers || [];
        const curM = s.maneuvers || [];
        if (curM.length > prevM.length) prev.maneuvers = curM;
      });
      draft.segmentSnaps = Array.from(byEdge.values());
    }

    function rebuildSegmentSnapsArray() {
      if (!draft) return;
      if (!Array.isArray(draft.segmentSnaps)) draft.segmentSnaps = [];
      dedupeSegmentSnaps();
      pruneOrphanSegmentGeometry();
      syncBusStraightSegmentGeometry();
      dedupeSegmentSnaps();
    }

    function constrainMarkerToSegmentPolyline(marker, seg) {
      const pts = segmentPolylinePoints(seg);
      if (!pts || pts.length < 2) return null;
      const latlngs = pts.map(p => [Number(p.lat), Number(p.lon)]);
      const snapped = closestLatLngOnPolyline(latlngs, marker.getLatLng());
      marker.setLatLng(snapped);
      return { latlngs, snapped, segLen: polylineLengthMeters(pts) };
    }

    window.getDraftJson = function() {
      if (draft) {
        if (draft.draftGeneration == null) {
          draft.draftGeneration = 0;
        }
        syncKeysFromSegmentSnaps();
      }
      return JSON.stringify(draft || {});
    };

    function notifyDraftChanged(recordUndo, manualFrom, manualTo) {
      if (!draft) return;
      draft.mapEditGeneration = (draft.mapEditGeneration || 0) + 1;
      delete draft.navDisplayNumbers;
      if (manualFrom && manualTo) {
        draft.manualConnectFrom = manualFrom;
        draft.manualConnectTo = manualTo;
      } else {
        delete draft.manualConnectFrom;
        delete draft.manualConnectTo;
      }
      const msg = { type: 'draftChanged', draft: draft, recordUndo: !!recordUndo };
      if (manualFrom && manualTo) {
        msg.manualConnectFrom = manualFrom;
        msg.manualConnectTo = manualTo;
      }
      post(msg);
    }

    function handleSegmentLineTap(seg, clickLatLng, latlngs) {
      const key = edgeKey(seg.fromNodeId, seg.toNodeId);
      const now = Date.now();
      const isDoubleTap = key === lastLineTapKey && (now - lastLineTapAtMs) <= SEGMENT_LINE_DOUBLE_TAP_MS;
      if (isDoubleTap) {
        lastLineTapKey = null;
        lastLineTapAtMs = 0;
        insertManeuverOnSegment(seg, clickLatLng, latlngs);
        return;
      }
      lastLineTapKey = key;
      lastLineTapAtMs = now;
      selectedNavMarkerKey = null;
      draft.selectedSegmentFrom = seg.fromNodeId;
      draft.selectedSegmentTo = seg.toNodeId;
      draft.activeEditSegmentOrder = seg.order;
      render();
      post({
        type: 'segmentSelected',
        from: seg.fromNodeId,
        to: seg.toNodeId,
        segmentOrder: seg.order
      });
    }

    function isSegmentSelected(seg) {
      if (!draft || !seg) return false;
      if (draft.activeEditSegmentOrder != null && Number(draft.activeEditSegmentOrder) === Number(seg.order)) {
        return true;
      }
      return draft.selectedSegmentFrom === seg.fromNodeId &&
        draft.selectedSegmentTo === seg.toNodeId;
    }

    function addSegmentPolylines() {
      const ordered = dedupeSegmentsForDraw();
      const drawOne = function(seg) {
        const a = draft.nodes.find(x => x.id === seg.fromNodeId);
        const b = draft.nodes.find(x => x.id === seg.toNodeId);
        if (!a || !b) return;
        const ca = nodeCoord(a), cb = nodeCoord(b);
        if (!ca || !cb) return;
        const key = segmentEdgeKey(seg);
        removeLineLayersForKey(key);
        const busStraightKeys = draft.roadBusStraightEdgeKeys || [];
        const busStraight = busStraightKeys.includes(key);
        const isSelected = isSegmentSelected(seg);
        const pts = segmentPoints(seg);
        const snappedOnRoad = busStraight || segmentEdgeSnapped(seg) || !!(pts && pts.length >= 3);
        const latlngs = (pts && pts.length >= 2)
          ? pts.map(p => [Number(p.lat), Number(p.lon)])
          : [[ca.lat, ca.lon], [cb.lat, cb.lon]];
        let lineColor;
        if (busStraight) {
          lineColor = '#ff9800';
        } else if (snappedOnRoad) {
          lineColor = routeLineColor();
        } else {
          lineColor = '#ffeb3b';
        }
        const baseWeight = (snappedOnRoad || busStraight) ? 5 : 4;
        const showYellow = !snappedOnRoad && !busStraight;
        if (isSelected && showYellow) {
          const sel = L.polyline(latlngs, {
            color: '#ffeb3b',
            weight: baseWeight + 4,
            opacity: 0.45,
            dashArray: null,
            interactive: false
          }).addTo(map);
          lines[key + '_sel'] = sel;
        } else if (isSelected && snappedOnRoad) {
          const sel = L.polyline(latlngs, {
            color: routeLineColor(),
            weight: baseWeight + 3,
            opacity: 0.35,
            dashArray: null,
            interactive: false
          }).addTo(map);
          lines[key + '_sel'] = sel;
        }
        const hit = L.polyline(latlngs, {
          color: lineColor,
          weight: 12,
          opacity: 0.001,
          dashArray: null,
          interactive: true
        }).addTo(map);
        const line = L.polyline(latlngs, {
          color: lineColor,
          weight: baseWeight,
          opacity: isSelected ? 1 : 0.9,
          dashArray: busStraight ? '10 6' : null,
          interactive: false
        }).addTo(map);
        hit.on('click', e => {
          if (e.originalEvent && e.originalEvent.shiftKey) {
            L.DomEvent.stopPropagation(e);
            insertWaypointOnSegment(seg, e.latlng, latlngs);
            return;
          }
          L.DomEvent.stopPropagation(e);
          handleSegmentLineTap(seg, e.latlng, latlngs);
        });
        lines[key] = line;
        lines[key + '_hit'] = hit;
      };
      // Aufsteigend zeichnen: höhere order liegt oben und erhält Klicks (auch vor manuellem Waypoint).
      ordered.forEach(seg => drawOne(seg));
    }

    function rebuildSnappedShapeFromSegments() {
      if (!draft) return;
      const ordered = (draft.segments || []).slice().sort((a, b) => (a.order || 0) - (b.order || 0));
      const shape = [];
      ordered.forEach(seg => {
        const pts = segmentPolylinePoints(seg);
        if (!pts || pts.length < 2) return;
        pts.forEach((p, i) => {
          if (i === 0 && shape.length) {
            const last = shape[shape.length - 1];
            if (Math.abs(last.lat - p.lat) < 1e-10 && Math.abs(last.lon - p.lon) < 1e-10) return;
          }
          shape.push({ lat: p.lat, lon: p.lon });
        });
      });
      draft.snappedShape = shape;
    }

    /**
     * Nummerierung = Reihenfolge auf der Snap-Route (Segment-Order + Distanz im Segment).
     * Keine Projektion auf die Gesamt-Shape: bei Kreuzungen/Stichfahrt würde sonst die
     * geografisch früheste Passage greifen (Worringer: Rechtsabbiegen als 3 statt 7).
     */
    function numberCandidatesBySnapRouteOrder(candidates) {
      return candidates.slice().sort((a, b) =>
        (a.prefer - b.prefer) ||
        ((a.seg.order || 0) - (b.seg.order || 0)) ||
        ((Number(a.maneuver.distanceM) || 0) - (Number(b.maneuver.distanceM) || 0)) ||
        (a.idx - b.idx)
      ).map(c => {
        c.along = c.prefer;
        return c;
      });
    }

    function addNavSymbolMarkers() {
      rebuildSnappedShapeFromSegments();
      delete draft.navDisplayNumbers;
      const orderedSegs = (draft.segments || []).slice().sort((a, b) => (a.order || 0) - (b.order || 0));
      const candidates = [];
      let cumulative = 0;
      const seenMarkerKeys = new Set();
      orderedSegs.forEach(seg => {
        const pts = segmentPolylinePoints(seg);
        const segLen = pts && pts.length >= 2 ? polylineLengthMeters(pts) : 0;
        const mans = segmentManeuvers(seg);
        if (!pts || pts.length < 2) {
          cumulative += segLen;
          return;
        }
        mans.forEach((maneuver, idx) => {
          const symbolType = effectiveSymbolType(maneuver);
          if (!shouldDisplayManeuverOnMap(maneuver, symbolType, segLen)) return;
          let key = edgeKey(seg.fromNodeId, seg.toNodeId) + '_m' + idx;
          if (seenMarkerKeys.has(key)) {
            key = edgeKey(seg.fromNodeId, seg.toNodeId) + '_o' + (seg.order || 0) + '_m' + idx;
            if (seenMarkerKeys.has(key)) return;
          }
          seenMarkerKeys.add(key);
          const rawD = Math.max(0, Number(maneuver.distanceM) || 0);
          const localD = (segLen > 1 && rawD > segLen + 15)
            ? Math.min(Math.max(0, rawD - cumulative), segLen)
            : Math.min(rawD, segLen > 0 ? segLen : rawD);
          const pos = samplePointAtDistance(pts, localD);
          if (!pos) return;
          // Meter ab Routenstart entlang der Segmentkette (= Snap-Fahrreihenfolge)
          const prefer = cumulative + localD;
          candidates.push({
            seg, idx, maneuver, symbolType, key, pos, prefer, along: prefer
          });
        });
        cumulative += segLen;
      });
      const numbered = numberCandidatesBySnapRouteOrder(candidates);
      numbered.forEach((c, i) => {
        const badge = i + 1;
        const isNavSelected = selectedNavMarkerKey === c.key;
        const icon = createNavSymbolIcon(c.symbolType, isNavSelected, String(badge));
        ensureNavManeuverPane();
        const m = L.marker([c.pos.lat, c.pos.lon], {
          icon,
          draggable: true,
          pane: 'navManeuverPane',
          className: 'nav-marker-leaflet',
          zIndexOffset: 3000 + badge + (isNavSelected ? 250 : 0)
        }).addTo(map);
        const dist = Math.round(c.along || 0);
        m.bindTooltip(
          badge + '. ' + maneuverDisplayLabel(c.maneuver, c.symbolType) + ' (' + dist + ' m)',
          { direction: 'top' }
        );
        m.on('click', ev => {
          if (ev && ev.originalEvent) L.DomEvent.stopPropagation(ev);
          selectedFrom = null;
          selectedNavMarkerKey = c.key;
          draft.selectedNavMarkerKey = c.key;
          render();
          emitNavSymbolSelected(c.seg, c.idx, c.symbolType, c.maneuver.instruction);
        });
        m.on('drag', () => { constrainMarkerToSegmentPolyline(m, c.seg); });
        m.on('dragend', () => {
          const hit = constrainMarkerToSegmentPolyline(m, c.seg);
          if (!hit) return;
          const alongDrag = Math.max(0, Math.min(hit.segLen, distanceAlongPolylineMeters(hit.latlngs, hit.snapped)));
          c.maneuver.distanceM = alongDrag;
          const snap = ensureSegmentSnap(c.seg, hit.latlngs);
          if (snap.maneuvers && snap.maneuvers[c.idx]) snap.maneuvers[c.idx].distanceM = alongDrag;
          selectedNavMarkerKey = c.key;
          render();
          notifyDraftChanged(true);
          emitNavSymbolSelected(c.seg, c.idx, c.symbolType, c.maneuver.instruction, { recordUndo: true });
        });
        navMarkers[c.key] = m;
      });
    }

    function refreshPolylinesOnly() {
      if (!map || !draft) return;
      Object.values(lines).forEach(l => map.removeLayer(l));
      lines = {};
      addSegmentPolylines();
    }

    function renderNodeMarkers(boundsOut) {
      if (!draft || !draft.nodes) return;
      draft.nodes.forEach(n => {
        if (draggingNodeId === n.id) return;
        const c = nodeCoord(n);
        if (!c) return;
        const size = n.type === 'STOP' ? 20 : 16;
        const prefix = n.type === 'STOP' ? 'H: ' : n.type === 'ANNOUNCEMENT' ? 'A: ' : '';
        const label = prefix + (n.title || '');
        const selFrom = draft.selectedSegmentFrom;
        const selTo = draft.selectedSegmentTo;
        const isSelected = selectedFrom === n.id ||
          (!selectedFrom && !selectedNavMarkerKey &&
            (n.id === selFrom || n.id === selTo));
        const selectedClass = isSelected ? ' node-selected' : '';
        const icon = L.divIcon({
          className: 'node-marker-wrap',
          html: '<div style="text-align:center">' +
            '<div class="node-dot' + selectedClass + '" style="width:' + size + 'px;height:' + size + 'px;background:' + nodeColor(n.type) + ';margin:0 auto"></div>' +
            '<div class="node-label">' + label.replace(/</g, '') + '</div></div>',
          iconSize: [120, size + 22], iconAnchor: [60, (size + 22) / 2]
        });
        const m = L.marker([c.lat, c.lon], {
          icon,
          draggable: true,
          zIndexOffset: 800
        }).addTo(map);
        m.bindTooltip(label + ' (' + n.type + ')', { direction: 'top', sticky: true });
        m.on('dragstart', () => {
          draggingNodeId = n.id;
          if (map && map.dragging) map.dragging.disable();
        });
        m.on('drag', ev => {
          const ll = ev.target.getLatLng();
          n.lat = ll.lat;
          n.lon = ll.lng;
          refreshPolylinesOnly();
        });
        m.on('dragend', ev => {
          draggingNodeId = null;
          if (map && map.dragging) map.dragging.enable();
          const ll = ev.target.getLatLng();
          n.lat = ll.lat;
          n.lon = ll.lng;
          invalidateSnapsForNode(n.id);
          focusSegmentsForMovedNode(n.id);
          render();
          notifyDraftChanged(true);
          post({ type: 'nodeMoved', nodeId: n.id });
        });
        m.on('click', ev => {
          if (ev && ev.originalEvent) {
            L.DomEvent.stopPropagation(ev);
            L.DomEvent.preventDefault(ev);
          }
          onNodeClick(n);
        });
        markers[n.id] = m;
        boundsOut.push([c.lat, c.lon]);
      });
    }

    function render() {
      if (!map) return;
      Object.values(markers).forEach(m => {
        if (draggingNodeId && m === markers[draggingNodeId]) return;
        map.removeLayer(m);
      });
      if (!draggingNodeId) markers = {};
      else {
        const keep = markers[draggingNodeId];
        markers = {};
        if (keep) markers[draggingNodeId] = keep;
      }
      Object.values(lines).forEach(l => map.removeLayer(l)); lines = {};
      Object.values(navMarkers).forEach(m => map.removeLayer(m)); navMarkers = {};
      if (!draft || !draft.nodes || !draft.nodes.length) return;

      pruneOrphanSegmentGeometry();
      const bounds = [];
      addSegmentPolylines();
      renderNodeMarkers(bounds);
      addNavSymbolMarkers();
    }

    function invalidateSnapsForNode(nodeId) {
      if (!draft) return;
      draft.roadSnappedEdgeKeys = (draft.roadSnappedEdgeKeys || []).filter(k => !edgeTouchesNode(k, nodeId));
      draft.roadBusStraightEdgeKeys = (draft.roadBusStraightEdgeKeys || []).filter(k => !edgeTouchesNode(k, nodeId));
      draft.segmentSnaps = (draft.segmentSnaps || []).filter(s => s.fromNodeId !== nodeId && s.toNodeId !== nodeId);
      draft.snappedShape = [];
      draft.snappedManeuvers = [];
    }

    function focusSegmentsForMovedNode(nodeId) {
      if (!draft) return;
      const touching = (draft.segments || []).filter(s =>
        s.fromNodeId === nodeId || s.toNodeId === nodeId);
      if (!touching.length) return;
      const seg = touching.slice().sort((a, b) => (b.order || 0) - (a.order || 0))[0];
      draft.selectedSegmentFrom = seg.fromNodeId;
      draft.selectedSegmentTo = seg.toNodeId;
      draft.activeEditSegmentOrder = seg.order;
    }

    function resetNavSymbolSelection() {
      if (!selectedNavMarkerKey) return false;
      selectedNavMarkerKey = null;
      if (draft) delete draft.selectedNavMarkerKey;
      return true;
    }

    function clearSegmentHighlight() {
      if (!draft) return;
      delete draft.selectedSegmentFrom;
      delete draft.selectedSegmentTo;
      delete draft.activeEditSegmentOrder;
    }

    function onNodeClick(node) {
      const hadNavSymbol = resetNavSymbolSelection();
      clearSegmentHighlight();

      if (!selectedFrom) {
        selectedFrom = node.id;
        render();
        if (hadNavSymbol) post({ type: 'mapSelectionCleared' });
        return;
      }
      if (selectedFrom === node.id) {
        selectedFrom = null;
        render();
        return;
      }
      const fromId = selectedFrom;
      draft.segments = draft.segments || [];
      var exists = draft.segments.some(s => s.fromNodeId === fromId && s.toNodeId === node.id);
      invalidateSnapsForSegment(fromId, node.id);
      if (!exists) {
        draft.segments.push({ order: draft.segments.length + 1, fromNodeId: fromId, toNodeId: node.id });
      }
      const segRef = draft.segments.find(s => s.fromNodeId === fromId && s.toNodeId === node.id);
      draft.selectedSegmentFrom = fromId;
      draft.selectedSegmentTo = node.id;
      draft.activeEditSegmentOrder = segRef ? (segRef.order || draft.segments.length) : draft.segments.length;
      selectedFrom = null;
      render();
      notifyDraftChanged(true, fromId, node.id);
      post({
        type: 'segmentSelected',
        from: fromId,
        to: node.id,
        segmentOrder: draft.activeEditSegmentOrder
      });
    }

    initMap();
    post({ type: 'ready' });
  </script>
</body>
</html>
