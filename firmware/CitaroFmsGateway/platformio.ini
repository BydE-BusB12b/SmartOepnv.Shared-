; Waveshare ESP32-S3-RS485-CAN und ESP32-S3-RS485-CAN-U.
; CAN intern GPIO15/GPIO16, Anschluss am Board sind die Klemmen H und L.
; Fertiges Abbild liegt in image\. Weiteres Board: flash.ps1 (findet den USB-Anschluss selbst).

[env:citaro_fms]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.partitions = default_16MB.csv
upload_speed = 921600
monitor_speed = 115200
; USB_MODE bleibt 1 (Hardware-CDC am USB-Serial-JTAG). Damit bleibt COM7
; nach dem Start derselbe Anschluss, und das nächste Brennen geht ohne BOOT-Taste.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
